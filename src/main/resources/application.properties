spring.application.name=riva-backend
spring.profiles.active=dev

# Endpoints não mapeados disparam NoHandlerFoundException
# (capturado no GlobalExceptionHandler para resposta padronizada + log de scan)
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# JWT (HS256). Em produção, definir JWT_SECRET com pelo menos 32 bytes (256 bits).
jwt.secret=${JWT_SECRET:defaultDevSecretThatIsAtLeast256BitsLongForHS256Algorithm!!}
jwt.access-token.expiration=1800000
jwt.refresh-token.expiration=604800000

# Admin default — sobrescrever via variável de ambiente em produção
admin.default.password=${ADMIN_DEFAULT_PASSWORD:Admin@123456}

# AES-256-GCM para criptografia em repouso (campo User.email).
# A chave precisa ser Base64 de 32 bytes (256 bits). Gere com:
#   openssl rand -base64 32
# Em produção definir AES_ENCRYPTION_KEY como variável de ambiente.
aes.encryption.key=${AES_ENCRYPTION_KEY:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}

# HMAC-SHA256 secret para blind index do email (busca em coluna criptografada).
# Mínimo 32 caracteres. Em produção definir EMAIL_HASH_SECRET como variável de ambiente.
email.hash.secret=${EMAIL_HASH_SECRET:devEmailHashSecretAtLeast32CharsLong!}

# Rate limiting (Bucket4j) — limites por IP
rate-limit.general.requests-per-minute=60
rate-limit.auth.requests-per-minute=10

# CORS — origens permitidas (CSV). Em produção definir CORS_ALLOWED_ORIGINS.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8081}

# Integridade de payload (HMAC-SHA256 no header X-Signature).
# Desabilitado por default em dev. Em produção: HMAC_ENABLED=true + HMAC_SECRET definido.
security.hmac.enabled=${HMAC_ENABLED:false}
security.hmac.secret=${HMAC_SECRET:devHmacSecretAtLeast32CharsLongForDev!}

