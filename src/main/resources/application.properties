spring.application.name=riva-backend
spring.profiles.active=dev

# Endpoints nao mapeados disparam NoHandlerFoundException
# (capturado no GlobalExceptionHandler para resposta padronizada + log de scan).
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# JWT (HS256). Em producao, definir JWT_SECRET com no minimo 32 bytes.
jwt.secret=${JWT_SECRET:defaultDevSecretThatIsAtLeast256BitsLongForHS256Algorithm!!}
jwt.access-token.expiration=1800000
jwt.refresh-token.expiration=604800000

admin.default.password=${ADMIN_DEFAULT_PASSWORD:Admin@123456}

# AES-256-GCM (criptografia em repouso do User.email). Chave: Base64 de 32 bytes.
aes.encryption.key=${AES_ENCRYPTION_KEY:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}

# HMAC-SHA256 para blind index do email (busca em coluna criptografada).
email.hash.secret=${EMAIL_HASH_SECRET:devEmailHashSecretAtLeast32CharsLong!}

# Rate limiting (Bucket4j) — limites por IP.
rate-limit.general.requests-per-minute=60
rate-limit.auth.requests-per-minute=10

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8081}

# Integridade de payload (HMAC-SHA256 no header X-Signature). Off em dev.
security.hmac.enabled=${HMAC_ENABLED:false}
security.hmac.secret=${HMAC_SECRET:devHmacSecretAtLeast32CharsLongForDev!}

# Retencao da trilha de auditoria (LGPD). Job diario as 03:00 anonimiza entradas
# anteriores a N dias (user_id, ip_address e details viram NULL; preserva timestamp/action).
audit.retention.days=90
audit.retention.cron=0 0 3 * * *

# --- Observabilidade (Actuator / Micrometer) -------------------------------
# Expoe apenas o minimo necessario para monitoramento externo. Em producao o
# Actuator sobe numa PORTA SEPARADA (ver application-prod.properties) para que
# /actuator/** nunca fique exposto junto da API publica.
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoints.web.exposure.exclude=env,beans,configprops,threaddump,heapdump,loggers,mappings
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized
management.endpoint.health.group.readiness.include=readinessState,db
management.info.env.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true
# Metricas com tag de aplicacao/ambiente para separar series no Prometheus
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.environment=${spring.profiles.active}
# Histograma de latencia HTTP (habilita percentis p95/p99 no Grafana)
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=50ms,100ms,200ms,500ms,1s

info.app.name=RIVA backend
info.app.description=Inteligencia Competitiva Automotiva - Ford + FIAP 2026
info.app.challenge=Sprint 3 - DevSecOps

