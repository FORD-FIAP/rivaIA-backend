server.port=8080

# Banco: PostgreSQL na Azure. Credenciais via variaveis de ambiente.
# sslmode=require: a Azure exige conexao TLS.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/riva_prod?sslmode=require
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.h2.console.enabled=false

# --- Actuator numa porta de gestao separada ------------------------------------
# Em producao o Actuator NAO compartilha a porta 8080 da API publica. Sobe na
# 9090, que deve ficar acessivel apenas para a rede interna / Prometheus
# (regra de firewall ou service mesh - nunca exposta na internet).
management.server.port=9090
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# Nao revela a versao exata do build em erros/headers
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.tomcat.remoteip.remote-ip-header=X-Forwarded-For
server.forward-headers-strategy=native
