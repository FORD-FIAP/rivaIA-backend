spring.datasource.url=jdbc:h2:mem:rivatest;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

jwt.secret=testSecretThatIsAtLeast256BitsLongForHS256AlgorithmInTestEnvironment
jwt.access-token.expiration=1800000
jwt.refresh-token.expiration=604800000

admin.default.password=TestAdminPassword123

# AES-256-GCM key (Base64-encoded, 32 bytes) — test only
aes.encryption.key=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

# HMAC secret for email blind index — test only
email.hash.secret=testEmailHashSecretAtLeast32CharsLong!

# Rate limit alto por default nos testes (testes dedicados sobrescrevem com @TestPropertySource)
rate-limit.general.requests-per-minute=1000
rate-limit.auth.requests-per-minute=1000

# CORS — origens de teste
cors.allowed-origins=http://localhost:3000,http://localhost:8081

# HMAC payload desabilitado por default nos testes (teste dedicado habilita)
security.hmac.enabled=false
security.hmac.secret=testHmacSecretAtLeast32CharsLongForTests!
