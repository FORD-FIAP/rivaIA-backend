name: CI/CD - Production

on:
  push:
    branches:
      - production

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Rodar testes
        run: mvn test

      - name: Build com Maven
        run: mvn clean package -DskipTests

      - name: Criar application-prod.properties
        run: |
          cat > src/main/resources/application-prod.properties <<EOF
          server.port=8080
          spring.datasource.url=jdbc:postgresql://${{ secrets.PROD_DB_HOST }}:${{ secrets.PROD_DB_PORT }}/riva_prod?sslmode=require
          spring.datasource.username=${{ secrets.PROD_DB_USER }}
          spring.datasource.password=${{ secrets.PROD_DB_PASSWORD }}
          spring.datasource.driver-class-name=org.postgresql.Driver
          spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
          spring.jpa.hibernate.ddl-auto=validate
          spring.jpa.show-sql=false
          EOF

      - name: Deploy no servidor de produção
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USER }}
          key: ${{ secrets.PROD_SERVER_SSH_KEY }}
          script: |
            cd /app/riva-backend
            java -jar riva-backend.jar --spring.profiles.active=prod
