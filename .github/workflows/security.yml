name: DevSecOps - Security Pipeline

# Pipeline de seguranca continua do RIVA backend (Ford + FIAP 2026 - Sprint 3).
# Roda em todo push/PR para os branches principais e semanalmente (agenda),
# integrando as etapas: Secret Scanning -> SAST -> SCA -> IaC/Container Scan.
# Cada job publica um relatorio (artifact) e, quando possivel, um SARIF na aba Security.

on:
  push:
    branches: [main, develop, production]
  pull_request:
    branches: [main, develop, production]
  schedule:
    # Toda segunda-feira as 06:00 UTC (03:00 BRT) - varredura de rotina.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write   # necessario para o upload de SARIF
  actions: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1. SECRET SCANNING - detecta credenciais, chaves e tokens no historico git.
  #    Ferramenta: Gitleaks (OSS, binario oficial - sem necessidade de conta).
  # ---------------------------------------------------------------------------
  secret-scan:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (historico completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Gitleaks
        run: |
          GITLEAKS_VERSION=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Rodar Gitleaks (todo o historico)
        run: |
          gitleaks detect \
            --config .gitleaks.toml \
            --redact \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --exit-code 1 \
            --log-opts="--all"

      - name: Publicar relatorio Gitleaks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          if-no-files-found: ignore

      - name: Enviar SARIF para a aba Security
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  # ---------------------------------------------------------------------------
  # 2. SAST - analise estatica do codigo-fonte Java em busca de padroes
  #    inseguros (injection, cripto fraca, deserializacao, path traversal...).
  #    Ferramenta: Semgrep OSS com rulesets publicos (sem token/conta).
  # ---------------------------------------------------------------------------
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Semgrep
        run: pip install --quiet semgrep==1.90.0

      - name: Rodar Semgrep (Java + seguranca + OWASP Top 10)
        run: |
          semgrep scan \
            --config p/java \
            --config p/security-audit \
            --config p/secrets \
            --config p/owasp-top-ten \
            --metrics off \
            --sarif --output semgrep.sarif \
            --verbose
        continue-on-error: true

      - name: Publicar relatorio Semgrep
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep.sarif
          if-no-files-found: ignore

      - name: Enviar SARIF para a aba Security
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # ---------------------------------------------------------------------------
  # 3. SCA - Software Composition Analysis: vulnerabilidades conhecidas (CVE)
  #    nas dependencias transitivas do Maven.
  #    Ferramentas: OWASP Dependency-Check (oficial) + Trivy (rapido, redundancia).
  # ---------------------------------------------------------------------------
  sca:
    name: SCA (Dependency-Check + Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Resolver dependencias (arvore para evidencia)
        run: ./mvnw -B -ntp dependency:tree -DoutputFile=dependency-tree.txt

      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        continue-on-error: true
        with:
          project: riva-backend
          path: "."
          format: "HTML,SARIF,JSON"
          # NVD_API_KEY acelera muito o download da base de CVEs. Configure em
          # Settings > Secrets and variables > Actions (opcional - roda sem a chave).
          args: >
            --nvdApiKey ${{ secrets.NVD_API_KEY }}
            --failOnCVSS 7
            --enableRetired

      - name: Trivy - vulnerabilidades em dependencias (pom.xml)
        uses: aquasecurity/trivy-action@0.28.0
        continue-on-error: true
        with:
          scan-type: fs
          scanners: vuln
          format: sarif
          output: trivy-deps.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Publicar relatorios SCA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sca-reports
          path: |
            dependency-tree.txt
            reports/
            trivy-deps.sarif
          if-no-files-found: ignore

      - name: Enviar SARIF (Dependency-Check) para a aba Security
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/dependency-check-report.sarif
          category: dependency-check

      - name: Enviar SARIF (Trivy deps) para a aba Security
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-deps.sarif
          category: trivy-deps

  # ---------------------------------------------------------------------------
  # 4. IaC + CONTAINER SCAN - configuracoes inseguras no Dockerfile, docker-compose
  #    e workflows; e CVEs no sistema-base da imagem publicada.
  #    Ferramenta: Trivy (config + image).
  # ---------------------------------------------------------------------------
  iac-container-scan:
    name: IaC & Container Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy - misconfiguracao de IaC (Dockerfile, compose, workflows)
        uses: aquasecurity/trivy-action@0.28.0
        continue-on-error: true
        with:
          scan-type: config
          format: sarif
          output: trivy-iac.sarif
          severity: CRITICAL,HIGH,MEDIUM

      - name: Build da imagem Docker (sem publicar)
        run: docker build -t riva-backend:ci .

      - name: Trivy - CVEs na imagem
        uses: aquasecurity/trivy-action@0.28.0
        continue-on-error: true
        with:
          scan-type: image
          image-ref: riva-backend:ci
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Publicar relatorios Trivy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports
          path: |
            trivy-iac.sarif
            trivy-image.sarif
          if-no-files-found: ignore

      - name: Enviar SARIF (IaC) para a aba Security
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-iac.sarif
          category: trivy-iac

      - name: Enviar SARIF (imagem) para a aba Security
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

  # ---------------------------------------------------------------------------
  # 5. DEPENDENCY REVIEW - bloqueia PRs que introduzem dependencias vulneraveis
  #    ou com licenca incompativel. So roda em pull_request.
  # ---------------------------------------------------------------------------
  dependency-review:
    name: Dependency Review (PR)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
