name: DevSecOps - Security Pipeline

# Pipeline de seguranca continua do RIVA backend (Ford + FIAP 2026 - Sprint 3).
# Etapas: Secret Scanning -> SAST -> SCA -> IaC/Container Scan -> Dependency Review.
# Cada job publica um relatorio (artifact) e, quando o Code Scanning esta
# habilitado, um SARIF na aba Security. Os scanners rodam em modo informativo
# (nao bloqueiam o merge) - o gate fica na revisao humana dos achados.

on:
  push:
    branches: [main, develop, production]
  pull_request:
    branches: [main, develop, production]
  schedule:
    - cron: "0 6 * * 1"          # toda segunda 06:00 UTC (03:00 BRT)
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1. SECRET SCANNING - credenciais/tokens/chaves no codigo e no historico git.
  # ---------------------------------------------------------------------------
  secret-scan:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Instalar Gitleaks
        run: |
          VERSION=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Rodar Gitleaks
        run: |
          gitleaks detect \
            --config .gitleaks.toml \
            --redact \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --exit-code 1 \
            --log-opts="--all"

      - name: Publicar relatorio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          if-no-files-found: ignore

      - name: Enviar SARIF para a aba Security
        if: always() && hashFiles('gitleaks.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  # ---------------------------------------------------------------------------
  # 2. SAST - analise estatica do codigo Java (Semgrep OSS, sem conta).
  # ---------------------------------------------------------------------------
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Semgrep
        run: pip install --quiet semgrep==1.90.0

      - name: Rodar Semgrep (Java + seguranca + OWASP Top 10)
        continue-on-error: true
        run: |
          semgrep scan \
            --config p/java \
            --config p/security-audit \
            --config p/secrets \
            --config p/owasp-top-ten \
            --metrics off \
            --sarif --output semgrep.sarif \
            || echo "semgrep terminou com achados/aviso (nao bloqueia o pipeline)"
          ls -la semgrep.sarif || echo "sem SARIF gerado"

      - name: Publicar relatorio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep.sarif
          if-no-files-found: ignore

      - name: Enviar SARIF para a aba Security
        if: always() && hashFiles('semgrep.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # ---------------------------------------------------------------------------
  # 3. SCA - CVEs nas dependencias Maven (Trivy CLI + OWASP Dependency-Check).
  # ---------------------------------------------------------------------------
  sca:
    name: SCA (Trivy + Dependency-Check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Arvore de dependencias (evidencia)
        run: ./mvnw -B -ntp dependency:tree -DoutputFile=dependency-tree.txt || true

      - name: Instalar Trivy
        continue-on-error: true
        run: |
          VERSION=0.74.0
          mkdir -p "$HOME/bin"
          curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/v${VERSION}/trivy_${VERSION}_Linux-64bit.tar.gz" \
            | tar -xz -C "$HOME/bin" trivy
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/trivy" --version

      - name: Trivy - vulnerabilidades em dependencias (pom.xml)
        continue-on-error: true
        run: |
          trivy fs --scanners vuln --severity CRITICAL,HIGH --exit-code 0 \
            --format sarif --output trivy-deps.sarif .
          trivy fs --scanners vuln --severity CRITICAL,HIGH --exit-code 0 \
            --format table --output trivy-deps.txt .

      - name: OWASP Dependency-Check
        continue-on-error: true
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: riva-backend
          path: "."
          format: "HTML,SARIF"
          args: >
            --nvdApiKey ${{ secrets.NVD_API_KEY }}
            --enableRetired

      - name: Publicar relatorios SCA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sca-reports
          path: |
            dependency-tree.txt
            trivy-deps.sarif
            trivy-deps.txt
            reports/
          if-no-files-found: ignore

      - name: Enviar SARIF (Trivy) para a aba Security
        if: always() && hashFiles('trivy-deps.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-deps.sarif
          category: trivy-deps

      - name: Enviar SARIF (Dependency-Check) para a aba Security
        if: always() && hashFiles('reports/dependency-check-report.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/dependency-check-report.sarif
          category: dependency-check

  # ---------------------------------------------------------------------------
  # 4. IaC + CONTAINER SCAN - Dockerfile/compose/workflows + CVEs na imagem.
  # ---------------------------------------------------------------------------
  iac-container-scan:
    name: IaC & Container Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Instalar Trivy
        continue-on-error: true
        run: |
          VERSION=0.74.0
          mkdir -p "$HOME/bin"
          curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/v${VERSION}/trivy_${VERSION}_Linux-64bit.tar.gz" \
            | tar -xz -C "$HOME/bin" trivy
          echo "$HOME/bin" >> "$GITHUB_PATH"
          "$HOME/bin/trivy" --version

      - name: Trivy - misconfiguracao de IaC
        continue-on-error: true
        run: |
          trivy config --severity CRITICAL,HIGH,MEDIUM --exit-code 0 \
            --format sarif --output trivy-iac.sarif .
          trivy config --severity CRITICAL,HIGH,MEDIUM --exit-code 0 \
            --format table --output trivy-iac.txt .

      - name: Build da imagem Docker (sem publicar)
        id: build
        continue-on-error: true
        run: docker build -t riva-backend:ci .

      - name: Trivy - CVEs na imagem
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          trivy image --severity CRITICAL,HIGH --ignore-unfixed --exit-code 0 \
            --format sarif --output trivy-image.sarif riva-backend:ci
          trivy image --severity CRITICAL,HIGH --ignore-unfixed --exit-code 0 \
            --format table --output trivy-image.txt riva-backend:ci

      - name: Publicar relatorios Trivy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports
          path: |
            trivy-iac.sarif
            trivy-iac.txt
            trivy-image.sarif
            trivy-image.txt
          if-no-files-found: ignore

      - name: Enviar SARIF (IaC) para a aba Security
        if: always() && hashFiles('trivy-iac.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-iac.sarif
          category: trivy-iac

      - name: Enviar SARIF (imagem) para a aba Security
        if: always() && hashFiles('trivy-image.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

  # ---------------------------------------------------------------------------
  # 5. DEPENDENCY REVIEW - alerta sobre dependencias vulneraveis novas no PR.
  #    Requer "Dependency graph" habilitado em Settings > Code security.
  #    Fica dormente ate a variavel de repositorio ENABLE_DEPENDENCY_REVIEW=true
  #    ser criada (Settings > Secrets and variables > Actions > Variables).
  # ---------------------------------------------------------------------------
  dependency-review:
    name: Dependency Review (PR)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && vars.ENABLE_DEPENDENCY_REVIEW == 'true'
    steps:
      - uses: actions/checkout@v7
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          warn-only: true
