version: 2

# Atualizacao automatica de dependencias com verificacao de vulnerabilidades.
# O Dependabot abre PRs quando ha versao nova ou CVE conhecido, alimentando a
# rotina de "revisao continua de dependencias" descrita no plano DevSecOps.

updates:
  # Dependencias da aplicacao (Maven / pom.xml)
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - security
    commit-message:
      prefix: "chore(deps)"
    groups:
      spring:
        patterns:
          - "org.springframework*"
          - "org.springframework.boot*"
      test:
        patterns:
          - "*junit*"
          - "org.testcontainers*"
          - "*mockito*"

  # Actions usadas nos workflows de CI/CD e no pipeline de seguranca
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    labels:
      - ci
      - security
    commit-message:
      prefix: "chore(ci)"

  # Imagem-base do Dockerfile
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    labels:
      - docker
      - security
    commit-message:
      prefix: "chore(docker)"
